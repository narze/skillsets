name: Fetch skills

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: fetch-skills
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - run: ./fetch.sh

      # Reuses the same branch, so an open PR is updated instead of a new one being opened.
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: fetch-skills
          delete-branch: true
          commit-message: Update skills
          title: Update skills
          body: |
            Automated update from `./fetch.sh`.

            🤖 Generated by the [Fetch skills](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) workflow.
